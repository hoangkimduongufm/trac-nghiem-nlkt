<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Thông tin trang và các tài nguyên được sử dụng -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14233b">
    <meta name="description" content="Ôn tập và thi thử Nguyên lý Kế toán chương 1 đến 7.">
    <title>Trắc nghiệm Nguyên lý Kế toán</title>
    <!-- Font chữ, stylesheet và mã ứng dụng -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="questions.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Khung chính của ứng dụng trắc nghiệm -->
    <main class="quiz-shell" id="app">
        <!-- Tiêu đề trang, đồng hồ thi và thống kê kết quả -->
        <header class="quiz-header">
            <div class="header-row">
                <div class="header-copy">
                    <p class="eyebrow">Ngân hàng câu hỏi · Chương 1–7</p>
                    <h1>Trắc nghiệm Nguyên lý Kế toán</h1>
                    <p class="header-description">Ôn tập 185 câu hỏi hoặc làm bài thi thử 60 câu trong 60 phút.</p>
                </div>
                <!-- Đồng hồ chỉ hiện trong chế độ thi thử -->
                <div id="timer-box" class="timer hidden" role="timer" aria-live="polite">
                    <span aria-hidden="true">⏱</span>
                    <span id="time-remaining">60:00</span>
                </div>
            </div>

            <!-- Tổng số câu, số câu đã làm và điểm hiện tại -->
            <div class="quiz-stats" id="quiz-meta" aria-live="polite">
                <span id="meta-total">Tổng số câu: 185</span>
                <span id="meta-answered">Đã trả lời: 0/185</span>
                <span id="meta-score">Số câu đúng: 0</span>
            </div>
        </header>

        <!-- Chọn chế độ, nộp bài hoặc bắt đầu lại -->
        <nav class="mode-bar" id="mode-selection" aria-label="Chọn chế độ làm bài">
            <p class="mode-bar-title">
                <svg class="mode-bar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z" />
                    <path d="M4 5.5v16M8 7h8M8 11h8" />
                </svg>
                <span>Chọn chế độ làm bài</span>
            </p>
            <button class="button mode-button mode-button--review" type="button" onclick="startStandardMode(false)">Ôn thứ tự</button>
            <button class="button mode-button mode-button--shuffle" type="button" onclick="startStandardMode(true)">Ôn ngẫu nhiên</button>
            <button class="button mode-button mode-button--exam" type="button" onclick="startExamMode()">Thi thử 60 câu</button>
            <button class="button mode-button mode-button--reset" type="button" onclick="resetQuiz()">Làm lại</button>
            <button id="submit-button" class="button mode-button mode-button--submit hidden" type="button" onclick="submitQuiz()">Nộp bài</button>
        </nav>

        <div id="question-tools" class="question-tools hidden" aria-label="Điều hướng câu hỏi">
            <label class="question-select-label" for="question-select">Chọn câu muốn ôn tập</label>
            <select id="question-select" onchange="jumpToQuestion(this.value)" aria-label="Chọn câu hỏi"></select>
        </div>
        <!-- JavaScript hiển thị danh sách câu hỏi tại đây -->
        <section class="question-list" id="question-container" aria-label="Danh sách câu hỏi">
            <p class="loading-message">Đang tải câu hỏi…</p>
        </section>
        <!-- Nút nộp bài ở cuối danh sách câu hỏi, chỉ dùng trong thi thử -->
        <div class="bottom-submit-row">
            <button id="submit-button-bottom" class="button bottom-submit hidden" type="button" onclick="submitQuiz()">Nộp bài</button>
        </div>
    </main>

    <!-- Hộp thoại tổng kết sau khi nộp bài -->
    <button class="floating-top-button" type="button" onclick="scrollToTop()" aria-label="Cuộn về đầu trang" title="Về đầu trang">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m5 12 7-7 7 7M12 5v14" />
        </svg>
        <span>Đầu trang</span>
    </button>
    <div class="modal-overlay hidden" id="results-modal" role="dialog" aria-modal="true" aria-labelledby="results-title">
        <section class="results-card">

            <button class="modal-close" type="button" onclick="closeResults()" aria-label="Đóng kết quả">×</button>
            <div class="results-icon" aria-hidden="true">✓</div>
            <h2 id="results-title">Kết quả bài làm</h2>
            <p class="results-text" id="result-text"></p>
            <div class="results-actions">
                <button class="button button--primary" type="button" onclick="closeResults()">Xem lại bài làm</button>
                <button class="button button--secondary" type="button" onclick="resetQuiz(); closeResults();">Làm lại từ đầu</button>
            </div>
        </section>
    </div>
</body>
</html>
