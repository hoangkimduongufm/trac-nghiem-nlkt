<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Kế toán (Chương 1 - 4) - Tương tác tức thì</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Đặt defer ở đây -->
    <script src="questions.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
    <div id="app" class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 my-6">
        
        <!-- Header Section -->
        <div class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white p-6 md:p-8">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Trắc nghiệm Kế toán (Chương 1 - 4)</h1>
            <p class="text-indigo-100 mt-2 text-sm md:text-base">Bộ 115 câu hỏi ôn tập đầy đủ, hiện đáp án và phản hồi tức thì khi chọn.</p>
            <div id="quiz-meta" class="flex flex-wrap gap-4 mt-4 text-xs md:text-sm font-medium bg-indigo-700/50 p-3 rounded-xl backdrop-blur-sm">
                <span id="meta-total">Tổng số câu: 115</span>
                <span id="meta-answered">Đã trả lời: 0/115</span>
                <span id="meta-score">Số câu đúng: 0</span>
            </div>
        </div>

        <!-- Toolbar / Navigation bar -->
        <div class="bg-slate-100 p-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <label for="jump-select" class="text-sm font-semibold text-slate-600">Đến câu:</label>
                <select id="jump-select" onchange="jumpToQuestion(this.value)" class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <!-- Options populated via JS -->
                </select>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="submitQuiz()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition shadow-sm">
                    Xem tổng kết & Kết quả
                </button>
                <button onclick="resetQuiz()" class="bg-rose-500 hover:bg-rose-600 text-white text-sm font-semibold px-4 py-2 rounded-xl transition shadow-sm">
                    Làm lại từ đầu
                </button>
            </div>
        </div>

        <!-- Quiz Main Content Area -->
        <div class="p-6 md:p-8 min-h-[400px]" id="question-container">
            <!-- Dynamic Question rendered here -->
        </div>

        <!-- Footer Pagination Controls -->
        <div class="bg-slate-50 p-4 border-t border-slate-200 flex items-center justify-between">
            <button id="btn-prev" onclick="prevQuestion()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold px-5 py-2 rounded-xl transition shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                ← Câu trước
            </button>
            <span id="page-indicator" class="text-sm font-medium text-slate-600">Câu 1 / 115</span>
            <button id="btn-next" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded-xl transition shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                Câu tiếp →
            </button>
        </div>
    </div>

    <!-- Results Modal / View -->
    <div id="results-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 md:p-8 text-center animate-scaleIn">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                🏆
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Tổng kết quá trình ôn tập</h2>
            <p id="result-text" class="text-slate-600 mt-2 text-lg font-medium"></p>
            <div class="mt-6 flex flex-col gap-3">
                <button onclick="closeResults()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-sm">
                    Tiếp tục ôn tập
                </button>
                <button onclick="resetQuiz(); closeResults();" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 rounded-xl transition">
                    Làm bài mới từ đầu
                </button>
            </div>
        </div>
    </div>
</body>
</html>
